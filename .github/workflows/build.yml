name: Build

# Every branch and pull request: the same checks the project asks for before
# anything is merged (see CLAUDE.md).
#
# Nothing here uses a published action (`actions/checkout` and friends). A
# Forgejo runner fetches those from code.forgejo.org, which this instance
# can't authenticate against (forgejo#2809), and they would need Node on the
# runner. Cloning the repository by hand is a few lines and has neither
# problem.
# Not on `main`: a release pushes the merge and the tag seconds apart, which
# started this workflow and the release one at the same time. With one
# runner they share a working copy, and each starts by emptying it — the
# build on `main` died in the middle of its tests while the release was
# checking out. Every change reaches `main` through a branch this has
# already checked, and the release workflow runs the same checks on the tag,
# so nothing goes unchecked. Build `main` on demand with workflow_dispatch.
on:
  push:
    branches: ['**', '!main']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out this commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job runs on the host, in a workspace that may hold the last
          # job's files: start from an empty one.
          Get-ChildItem -Force . | Remove-Item -Recurse -Force
          git init --quiet --initial-branch=build .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          # The credential goes on the command, never into .git/config.
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          git -c $auth fetch --quiet --depth=1 origin ${{ github.sha }}
          git checkout --quiet --detach FETCH_HEAD
          git log --oneline -1

      - name: Use the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Formatting
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Build
        run: |
          cargo build --release --locked
          # No upload-artifact (see the note at the top): the program is left
          # in the runner's workspace.
          Get-Item target/release/FlexTaskbar.exe | Select-Object FullName, Length, LastWriteTime

      # What only a real desktop can answer: the bar appearing, docking,
      # reserving its screen space and giving it back, and what it tells a
      # screen reader. The script exits 2 when it can't run — a runner started
      # as a Windows service has no desktop — and that is a skip, not a
      # failure, so this step is useful where it can run and quiet where it
      # can't.
      - name: Smoke test on the desktop
        run: |
          powershell -ExecutionPolicy Bypass -File tools\smoke-test.ps1
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Host "::warning::Smoke test skipped: no interactive desktop on this runner."
            exit 0
          }
          exit $code
