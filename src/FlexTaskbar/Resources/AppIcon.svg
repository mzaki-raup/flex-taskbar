<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FE0FF"/>
      <stop offset="1" stop-color="#3FA9F5"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60CDFF"/>
      <stop offset="1" stop-color="#2E86D6"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A9EDB"/>
      <stop offset="1" stop-color="#1C63A8"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
  </defs>

  <!-- Three staggered category bars -->
  <rect x="48"  y="44"  width="160" height="34" rx="17" fill="url(#bar1)"/>
  <rect x="48"  y="94"  width="120" height="34" rx="17" fill="url(#bar2)"/>
  <rect x="48"  y="144" width="88"  height="34" rx="17" fill="url(#bar3)"/>

  <!-- Dock / taskbar strip anchoring the bars -->
  <rect x="32" y="200" width="192" height="30" rx="15" fill="url(#dock)" stroke="#3D3D3D" stroke-width="2"/>
  <circle cx="60"  cy="215" r="5" fill="#8FE0FF"/>
  <circle cx="84"  cy="215" r="5" fill="#60CDFF"/>
  <circle cx="108" cy="215" r="5" fill="#3A9EDB"/>
</svg>
